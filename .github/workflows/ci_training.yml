name: CI - Train Model & Build Docker

on:
  push:
    branches:
      - main
    paths:
      - "MLProject/**"

  workflow_dispatch:

jobs:
  train-and-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Directory
        run: |
          pwd
          ls -R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn

      - name: Train Model
        working-directory: MLProject
        run: mlflow run . --env-manager=local

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-artifact
          path: MLProject/saved_model
          retention-days: 14

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        working-directory: MLProject
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/ml-model-keuangan:latest

          mlflow models build-docker \
            -m saved_model \
            -n $IMAGE_NAME

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-model-keuangan:latest